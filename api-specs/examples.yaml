# Platzhalter fuer die Beispiel-Sammlung der Data Management API.
#
# kommonitor_dataAccessAPI.yaml referenziert diese Nachbardatei 126-mal
# (./examples.yaml#/components/examples/...), sie ist im Backend-Repo
# KomMonitor/data-management aber nicht eingecheckt — auf keinem Branch.
# Ohne sie bricht `npm run generate:api-types` beim Aufloesen der $refs ab.
#
# Die Eintraege sind bewusst leer: `examples` ist rein dokumentarisch und
# fliesst nicht in die generierten Typen ein (es gibt keinen einzigen
# $ref aus dieser Datei auf ein Schema). Der Stub haelt damit die
# Haupt-Spec byte-identisch zur Upstream-Fassung, so dass ein Update
# weiterhin ein reines Kopieren ist.
#
# Sobald das Backend-Repo die echte Datei mitliefert, ersetzt sie diesen
# Stub ersatzlos.

