<app-admin-content-view
  [title]="'ADMIN_TOPICS.TITLE' | translate"
  [description]="'ADMIN_TOPICS.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<!--
  View-level switch belongs in the header's controls slot, like the "show only
  editable" switch of the group management. As the first element of the content
  it rendered a 16px bold `<b>` label on the grey ground above the boxes,
  instead of the 12px header scale.
-->
<ng-template #controls>
  <span>{{ 'ADMIN_TOPICS.SHOW_IDS' | translate }}</span>
  <div>
    <label class="switch">
      <input type="checkbox" [(ngModel)]="showTopicIds" />
      <span class="switchslider round"></span>
    </label>
  </div>
</ng-template>

<ng-template #content>
  @if (indicatorOrder(); as indicatorOrder) {
    <!-- Sorting mode of the hierarchy; adding topics happens in the tree itself. -->
    <div class="topic-toolbar">
      <app-topic-order-selection
        [orderMode]="indicatorOrder"
        [label]="'ADMIN_TOPICS.INDICATOR_SORTING' | translate"
        [topicResourceType]="'indicator'"
        (selectedOptionChange)="setIndicatorSorting($event)"
      ></app-topic-order-selection>
    </div>

    <app-collapsible-section
      [title]="'ADMIN_TOPICS.INDICATOR_HIERARCHY' | translate"
      [meta]="mainTopicCountLabel(indicatorTopics().length)"
      [(open)]="indicatorSectionOpen"
    >
      <app-topic-tree
        [topics]="indicatorTopics()"
        [topicResourceType]="'indicator'"
        [order]="indicatorOrder"
        [showTopicIds]="showTopicIds"
      ></app-topic-tree>
    </app-collapsible-section>
  }

  @if (geoRessourceOrder(); as geoRessourceOrder) {
    <div class="topic-toolbar">
      <app-topic-order-selection
        [orderMode]="geoRessourceOrder"
        [label]="'ADMIN_TOPICS.GEORESOURCE_SORTING' | translate"
        [topicResourceType]="'georesource'"
        (selectedOptionChange)="setGeoRessourceSorting($event)"
      ></app-topic-order-selection>
    </div>

    <app-collapsible-section
      [title]="'ADMIN_TOPICS.GEORESOURCE_HIERARCHY' | translate"
      [meta]="mainTopicCountLabel(geoRessourceTopics().length)"
      [(open)]="geoRessourceSectionOpen"
    >
      <app-topic-tree
        [topics]="geoRessourceTopics()"
        [topicResourceType]="'georesource'"
        [order]="geoRessourceOrder"
        [showTopicIds]="showTopicIds"
      ></app-topic-tree>
    </app-collapsible-section>
  }

  <!-- Error Alert -->
  @if (errorHandlingService.errorMessagePart) {
    <div id="topicsErrorAlert" class="alert alert-danger alert-dismissible">
      <button
        type="button"
        class="btn-close"
        [attr.aria-label]="'ADMIN_SHARED.CLOSE' | translate"
        (click)="errorHandlingService.errorMessagePart = ''"
      ></button>
      <h4><i class="icon fa fa-ban"></i> {{ 'ADMIN_SHARED.ERROR' | translate }}</h4>
      <div [innerHTML]="errorHandlingService.errorMessagePart"></div>
    </div>
  }
</ng-template>
