<app-admin-content-view
  title="Themenverwaltung"
  description="Management der Themenhierarchien für Indikatoren und Georessourcen"
  [contentTemplate]="content"
>
</app-admin-content-view>
<ng-template #content>
  <b>Zeige IDs</b>
  &nbsp;
  <label class="switch">
    <input type="checkbox" [(ngModel)]="showTopicIds" />
    <span class="switchslider round"></span>
  </label>

  <br />

  <expandable-box title="Themenhierarchie - Indikatoren" [collapsed]="false">
    @if (indicatorOrder) {
      <div class="just-padding">
        <div>
          <div>Sortierung der Indikatoren:</div>
          <app-topic-order-selection
            [orderMode]="indicatorOrder"
            (selectedOptionChange)="setIndicatorSorting($event)"
          ></app-topic-order-selection>
        </div>
        <app-topic-list
          [topics]="filteredIndicatorTopics"
          [showTopicIds]="showTopicIds"
          [levelLimit]="4"
          [topicResourceType]="'indicator'"
          [order]="indicatorOrder"
        ></app-topic-list>
        <app-admin-add-topic [topicResourceType]="'indicator'"></app-admin-add-topic>
      </div>
    }
  </expandable-box>

  <expandable-box title="Themenhierarchie - Georessourcen" [collapsed]="false" borderColor="red">
    @if (geoRessourceOrder) {
      <div class="just-padding">
        <div>
          <div>Sortierung der Georessourcen:</div>
          <app-topic-order-selection
            [orderMode]="geoRessourceOrder"
            (selectedOptionChange)="setGeoRessourceSorting($event)"
          ></app-topic-order-selection>
        </div>
        <app-topic-list
          [topics]="filteredGeoRessourceTopics"
          [showTopicIds]="showTopicIds"
          [levelLimit]="4"
          [topicResourceType]="'georesource'"
          [order]="geoRessourceOrder"
        ></app-topic-list>
        <app-admin-add-topic [topicResourceType]="'georesource'"></app-admin-add-topic>
      </div>
    }
  </expandable-box>

  <!-- Error Alert -->
  @if (errorHandlingService.errorMessagePart) {
    <div id="topicsErrorAlert" class="alert alert-danger alert-dismissible">
      <button type="button" class="close" data-dismiss="alert" aria-hidden="true">×</button>
      <h4><i class="icon fa fa-ban"></i> Fehler!</h4>
      <div [innerHTML]="errorHandlingService.errorMessagePart"></div>
    </div>
  }
</ng-template>
