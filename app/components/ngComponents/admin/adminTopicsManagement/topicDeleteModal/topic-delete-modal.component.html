<div class="modal-header">
  <h4 class="modal-title">{{ 'ADMIN_TOPICS.DELETE_MODAL.TITLE' | translate }}</h4>
  <button
    type="button"
    class="btn-close"
    [attr.aria-label]="'ADMIN_SHARED.CLOSE' | translate"
    (click)="close()"
  ></button>
</div>

<div class="modal-body">
  <app-loading-overlay [loading]="loadingData()">
    <h4>
      <b>{{ 'ADMIN_TOPICS.DELETE_MODAL.CONFIRM_QUESTION' | translate }}</b>
    </h4>
    <p>{{ 'ADMIN_TOPICS.DELETE_MODAL.CASCADE_HINT' | translate }}</p>

    <pre
      id="deleteTopicPre"
      style="overflow: auto; max-height: 500px"
      [innerHTML]="topicToDeletePrettyPrint"
    ></pre>
  </app-loading-overlay>
</div>

<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary" (click)="close()">
    {{ 'ADMIN_SHARED.CLOSE' | translate }}
  </button>
  <div style="flex: 1"></div>
  <button type="button" class="btn btn-danger" (click)="deleteTopic()" [disabled]="!currentTopic">
    {{ 'ADMIN_TOPICS.DELETE_MODAL.DELETE_FOREVER' | translate }}
  </button>
</div>
