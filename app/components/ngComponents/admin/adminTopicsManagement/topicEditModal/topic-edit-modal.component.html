<div class="modal-header">
  <h4 class="modal-title">
    {{ 'ADMIN_TOPICS.EDIT_MODAL.TITLE_PREFIX' | translate }}
    <i>
      <b>{{ topic.topicName }}</b>
    </i>
    {{ 'ADMIN_TOPICS.EDIT_MODAL.TITLE_SUFFIX' | translate }}
  </h4>
  <button
    type="button"
    class="btn-close"
    [attr.aria-label]="'ADMIN_SHARED.CLOSE' | translate"
    (click)="cancel()"
  ></button>
</div>
<div class="modal-body">
  <app-loading-overlay [loading]="isSubmitting()">
    <!--
      No body heading here: it repeated the dialog title the header already
      shows, and the global `h4 { font-size: 16px; font-weight: 400 }` rendered
      it at exactly the size and weight of the field labels below it.
    -->
    <form [formGroup]="topicForm" (ngSubmit)="onSubmit()">
      <p class="text-center">
        <b
          ><i>{{ 'ADMIN_SHARED_UI.STEP.REQUIRED_FIELD_MARKER' | translate }}</i></b
        >
      </p>

      <!--
        Plain `.row`: with `.vertical-align` the short name column was centred
        against the five-row textarea, so its label sat some 60px below the
        description's.
      -->
      <div class="row">
        <div class="col-md-5">
          <div class="form-group">
            <label class="form-label" for="topic-name-input"
              >{{ 'ADMIN_TOPICS.EDIT_MODAL.NAME_LABEL' | translate }}*</label
            >
            <input
              id="topic-name-input"
              class="form-control"
              type="text"
              [placeholder]="'ADMIN_TOPICS.EDIT_MODAL.TITLE_PLACEHOLDER' | translate"
              formControlName="name"
              required
            />
            <app-form-error [control]="topicForm.controls.name" for="topic-name-input" />
          </div>
        </div>
        <div class="col-md-7">
          <div class="form-group">
            <label class="form-label" for="topic-description-input"
              >{{ 'ADMIN_TOPICS.EDIT_MODAL.DESCRIPTION_LABEL' | translate }}*</label
            >
            <textarea
              id="topic-description-input"
              rows="5"
              class="form-control"
              [placeholder]="'ADMIN_TOPICS.EDIT_MODAL.DESCRIPTION_LABEL' | translate"
              formControlName="description"
              required
            ></textarea>
            <app-form-error
              [control]="topicForm.controls.description"
              for="topic-description-input"
            />
          </div>
        </div>
      </div>
    </form>
  </app-loading-overlay>
</div>
<div class="modal-footer">
  <button type="button" class="btn btn-outline-secondary me-auto" (click)="cancel()">
    {{ 'ADMIN_SHARED.CANCEL' | translate }}
  </button>
  <button
    type="button"
    class="btn btn-success"
    [disabled]="topicForm.invalid || isSubmitting()"
    (click)="onSubmit()"
  >
    {{ 'ADMIN_TOPICS.EDIT_MODAL.UPDATE' | translate }}
  </button>
</div>
