<!--
  Flex row rather than a col-3/col-4/col-5 grid: the button only needs its own
  width, and a 3/12 column left a wide gap between it and the first field.
-->
<form role="form" class="add-topic-row">
  <div class="field field-title">
    <input
      class="form-control"
      type="text"
      [placeholder]="
        'ADMIN_TOPICS.ADD.TITLE_PLACEHOLDER' | translate: { type: (typeLabelKey | translate) }
      "
      [formControl]="form.controls.title"
      name="newTopicTitle"
      required
    />
    <app-form-error [control]="form.controls.title" />
  </div>
  <div class="field field-description">
    <textarea
      rows="1"
      class="form-control"
      [placeholder]="
        'ADMIN_TOPICS.ADD.DESCRIPTION_PLACEHOLDER' | translate: { type: (typeLabelKey | translate) }
      "
      [formControl]="form.controls.description"
      name="newTopicDescription"
      required
    ></textarea>
    <app-form-error [control]="form.controls.description" />
  </div>
  <button type="button" class="btn btn-success" (click)="onAddTopic()" [disabled]="form.invalid">
    <i class="fas fa-plus"></i>
    {{ 'ADMIN_TOPICS.ADD.ADD_BUTTON' | translate: { type: (typeLabelKey | translate) } }}
  </button>
</form>
