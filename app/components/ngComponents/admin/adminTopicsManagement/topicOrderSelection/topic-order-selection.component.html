<div>
  <div class="radio">
    <label>
      <input
        type="radio"
        value="alphabetical"
        [(ngModel)]="orderMode"
        (ngModelChange)="setOption($event)"
      />
      alphabetisch
    </label>
  </div>

  <div class="radio">
    <label>
      <input
        type="radio"
        value="custom"
        [(ngModel)]="orderMode"
        (ngModelChange)="setOption($event)"
      />
      benutzerdefiniert
    </label>
  </div>
</div>
