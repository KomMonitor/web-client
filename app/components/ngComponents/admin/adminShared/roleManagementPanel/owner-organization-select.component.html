<div class="row">
  <div class="col-md-3"></div>
  <div class="col-md-6 col-sm-6 col-12">
    @if (mode === 'assign') {
      <div class="alert alert-info">
        {{ 'ADMIN_SHARED_UI.OWNER.SELECT_HINT' | translate }}
      </div>
      <label class="form-label" for="targetUserRoleSelect"
        >{{ 'ADMIN_SHARED_UI.OWNER.ORG_LABEL' | translate }}*</label
      >
    } @else {
      <label class="form-label" for="targetUserRoleSelect"
        ><b>{{ 'ADMIN_SHARED_UI.OWNER.TRANSFER_TO' | translate }}</b></label
      >
    }
    <!--
      `input-group-text` and no `input-sm`: both of the classes this group used to
      name are Bootstrap 3 and undefined in Bootstrap 5. `input-group-addon` left
      the funnel a bare 16px glyph with no border, no background and no radius,
      while Bootstrap's input-group rule still squared off the input's left corner
      (`0 6px 6px 0`) for the prefix box it expected — so the icon floated beside a
      field that looked cut open. `input-sm` was meant to shrink the field and did
      nothing, which is just as well: the filter now matches the select it filters
      instead of standing 8px shorter than it. Same markup as the keyword filter in
      the indicator delete dialog.

      `mb-2` because the group and the select used to touch: the filter narrows the
      options below it, so they read as a pair rather than as one merged control.
    -->
    <div class="input-group mb-2">
      <span class="input-group-text"><i class="fas fa-filter"></i></span>
      <input
        type="text"
        class="form-control"
        [placeholder]="'ADMIN_SHARED.KEYWORD_FILTER' | translate"
        [(ngModel)]="ownerOrgFilter"
        name="ownerOrgFilter"
        [ngModelOptions]="{ standalone: true }"
      />
    </div>
    <select
      id="targetUserRoleSelect"
      class="form-control"
      [ngModel]="ownerId"
      (ngModelChange)="onChangeOwner($event)"
      name="ownerOrganization"
      [ngModelOptions]="{ standalone: true }"
      [required]="mode === 'assign'"
      [disabled]="disabled"
    >
      @if (mode === 'assign') {
        <option value="" disabled>{{ 'ADMIN_SHARED_UI.OWNER.SELECT_ORG' | translate }}</option>
      } @else {
        <option value="">
          <b>{{ 'ADMIN_SHARED_UI.OWNER.DO_NOT_TRANSFER' | translate }}</b>
        </option>
      }
      @for (org of getFilteredOrganizations(); track org.organizationalUnitId) {
        <option [value]="org.organizationalUnitId">{{ org.name }}</option>
      }
    </select>
  </div>
  <div class="col-md-3">
    @if (mode === 'transfer') {
      <label>{{ 'ADMIN_SHARED_UI.OWNER.CURRENT_ORG' | translate }}</label>
      <p>{{ getCurrentOwnerName() }}</p>
      @if (isOwnershipChanging) {
        <div class="help-block" style="color: red">
          <p>{{ 'ADMIN_SHARED_UI.OWNER.CHANGE_WARNING' | translate }}</p>
        </div>
      }
    }
  </div>
</div>
