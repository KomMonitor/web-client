<div id="adminRoleExplanationContent">
  <div align="center">
    <div class="loading-overlay" *ngIf="loadingData">
      <div class="spinner-border text-primary" role="status">
        <span class="sr-only">Loading...</span>
      </div>
    </div>
  </div>

  <section class="content-header">
    <h1>
      FAQ zu Mandantenkonzept und Zugriffsschutz auf Datens&auml;tze
      <small
        >&Uuml;bersicht und Bedienhinweise der ab KomMonitor Version 4
        eingef&uuml;hrten Zugriffskontrolle</small
      >
    </h1>
  </section>

  <section class="content container-fluid">
    <div class="row">
      <div class="col-md-6" *ngFor="let item of items">
        <div class="box-wrapper">
          <expandable-box [title]="item.title" [collapsed]="!item.expanded">
            <div class="box-content">
              <div [innerHTML]="item.content"></div>
              <div class="nested-accordion" *ngIf="item.nestedItems">
                <expandable-box
                  *ngFor="let nestedItem of item.nestedItems"
                  [title]="nestedItem.title"
                  [collapsed]="!nestedItem.expanded"
                >
                  <div [innerHTML]="nestedItem.content"></div>
                </expandable-box>
              </div>
            </div>
          </expandable-box>
        </div>
      </div>
    </div>
  </section>
</div>
