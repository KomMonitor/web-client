<app-admin-content-view
  [title]="'ADMIN_CONFIG.FILTER.TITLE' | translate"
  [description]="'ADMIN_CONFIG.FILTER.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<ng-template #controls>
  <button class="btn btn-success btn-sm" type="button" (click)="onAddFilter()">
    <i class="fas fa-plus"></i>&nbsp;&nbsp;{{ 'ADMIN_SHARED.CREATE' | translate }}
  </button>
</ng-template>

<ng-template #content>
  <expandable-box [title]="'ADMIN_CONFIG.FILTER.TABLE_BOX_TITLE' | translate" [collapsed]="false">
    <p>
      {{ 'ADMIN_CONFIG.FILTER.INTRO' | translate }}
    </p>

    <ag-grid-angular
      #agGrid
      style="height: 70vh"
      class="ag-theme-alpine"
      [columnDefs]="columnDefs()"
      [rowData]="rowData()"
      [gridOptions]="gridOptions"
      [defaultColDef]="gridOptions.defaultColDef"
      [pagination]="true"
      [paginationPageSize]="10"
      [rowSelection]="'multiple'"
      [suppressRowClickSelection]="true"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
      [suppressColumnVirtualisation]="true"
    >
    </ag-grid-angular>
  </expandable-box>

  <expandable-box [title]="'ADMIN_CONFIG.FILTER.CONFIG_BOX_TITLE' | translate" [collapsed]="false">
    <p>
      {{ 'ADMIN_CONFIG.FILTER.INTRO' | translate }}
    </p>

    <hr />

    <app-config-editor-panes [descriptor]="descriptor"></app-config-editor-panes>
  </expandable-box>
</ng-template>
