<app-admin-content-view
  title="Verwalten der Raumebenen"
  description="Info"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>
<ng-template #controls>
  <span>Nur editierbare Datensätze anzeigen</span>
  <div>
    <label class="switch">
      <input
        type="checkbox"
        [(ngModel)]="tableViewSwitcher"
        (ngModelChange)="onTableViewSwitch()"
      />
      <span class="switchslider round"></span>
    </label>
  </div>
  <button
    [disabled]="!accessControlService.checkCreatePermission()"
    class="btn btn-success btn-sm"
    type="button"
    (click)="openAddSpatialUnitModal()"
  >
    <i class="fas fa-plus"></i>&nbsp;&nbsp;Erstellen
  </button>
</ng-template>

<ng-template #content>
  <expandable-box title="Raumebenen" [isCollapsible]="false">
    <ag-grid-angular
      #spatialUnitOverviewTable
      id="spatialUnitOverviewTable"
      style="height: 70vh"
      class="ag-theme-alpine"
      [columnDefs]="columnDefs"
      [rowData]="rowData"
      [defaultColDef]="defaultColDef"
      [gridOptions]="gridOptions"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      [rowSelection]="'multiple'"
      [suppressRowClickSelection]="true"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
      [suppressColumnVirtualisation]="true"
    >
    </ag-grid-angular>
  </expandable-box>
</ng-template>
