<div class="tile" [style.background-color]="boxColor" [style.color]="textColor">
  <div class="inner">
    <div class="title">{{ titleText }}</div>
    <div class="description">{{ descriptionText }}</div>
  </div>
  @if (iconClass) {
    <div class="icon" aria-hidden="true">
      <i class="{{ iconClass }}"></i>
    </div>
  }
</div>
