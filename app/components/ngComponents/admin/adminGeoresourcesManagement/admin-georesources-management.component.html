<app-admin-content-view
  [title]="'ADMIN_GEORESOURCES.OVERVIEW.TITLE' | translate"
  [description]="'ADMIN_GEORESOURCES.OVERVIEW.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<ng-template #controls>
  <span>{{ 'ADMIN_SHARED.SHOW_ONLY_EDITABLE' | translate }}</span>
  <div>
    <label class="switch">
      <input
        type="checkbox"
        [ngModel]="tableViewSwitcher()"
        (ngModelChange)="tableViewSwitcher.set($event)"
      />
      <span class="switchslider round"></span>
    </label>
  </div>
  <div ngbDropdown class="d-inline-block">
    <button class="btn btn-success btn-sm" ngbDropdownToggle>
      + {{ 'ADMIN_SHARED.CREATE' | translate }}
    </button>

    <div ngbDropdownMenu class="addButton_dropdownWrapper">
      <button ngbDropdownItem type="button" (click)="onClickAddGeoresource()">
        {{ 'ADMIN_GEORESOURCES.CREATE_POI_LOI_AOI' | translate }}
      </button>
      <button
        ngbDropdownItem
        type="button"
        (click)="wmsSharedComponentsService.openAddModal(WmsResourceType.GEORESOURCE)"
      >
        {{ 'ADMIN_GEORESOURCES.CREATE_WMS' | translate }}
      </button>
    </div>
  </div>
</ng-template>

<!--
  `[collapsed]="false"` rather than `[isCollapsible]="false"`: the two sibling
  views have a single content box and pin it open, but this one stacks three
  70vh grids, so all three open on entry (as they did before the Angular port,
  where each box header rendered a `fa-minus` collapse tool) and the user can
  fold away the types they are not working on. The WMS box below keeps the
  shared component's collapsed default, exactly as in the indicator view.
-->
<ng-template #content>
  <expandable-box [title]="'ADMIN_GEORESOURCES.OVERVIEW.POI_BOX' | translate" [collapsed]="false">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="height: 70vh"
      [rowData]="poiRowData()"
      [columnDefs]="poiColumnDefs"
      [defaultColDef]="defaultColDef"
      [suppressRowClickSelection]="true"
      [rowSelection]="'multiple'"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
      [suppressColumnVirtualisation]="true"
    >
    </ag-grid-angular>
  </expandable-box>

  <expandable-box [title]="'ADMIN_GEORESOURCES.OVERVIEW.LOI_BOX' | translate" [collapsed]="false">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="height: 70vh"
      [rowData]="loiRowData()"
      [columnDefs]="loiColumnDefs"
      [defaultColDef]="defaultColDef"
      [suppressRowClickSelection]="true"
      [rowSelection]="'multiple'"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
      [suppressColumnVirtualisation]="true"
    >
    </ag-grid-angular>
  </expandable-box>

  <expandable-box [title]="'ADMIN_GEORESOURCES.OVERVIEW.AOI_BOX' | translate" [collapsed]="false">
    <ag-grid-angular
      class="ag-theme-alpine"
      style="height: 70vh"
      [rowData]="aoiRowData()"
      [columnDefs]="aoiColumnDefs"
      [defaultColDef]="defaultColDef"
      [suppressRowClickSelection]="true"
      [rowSelection]="'multiple'"
      [pagination]="true"
      [paginationPageSize]="paginationPageSize"
      [paginationPageSizeSelector]="paginationPageSizeSelector"
      [enableCellTextSelection]="true"
      [ensureDomOrder]="true"
      [suppressColumnVirtualisation]="true"
    >
    </ag-grid-angular>
  </expandable-box>

  <app-wms-admin-table [resourceType]="resourceType"></app-wms-admin-table>
</ng-template>
