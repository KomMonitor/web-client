<div id="adminGeoresourcesContent">

  <div align="center">
    <div class="loading-overlay-admin-panel ng-hide" *ngIf="loadingData">
      <span class="glyphicon glyphicon-refresh icon-spin"></span>
    </div>
  </div>

  <!-- Content Header (Page header) -->
  <section class="content-header">
    <h1>
      Verwalten der Geodaten
      <small>Info</small>
    </h1>

    <div class="adminTableButtonWrapper">
      <div class="verticalAlign">
        <span>Nur editierbare Datens&auml;tze anzeigen</span>
        <div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="tableViewSwitcher" (ngModelChange)="onTableViewSwitch()">
            <span class="switchslider round"></span>
          </label>
        </div>
      </div>
      <!-- batch update georesources -->
      <button id="button-batch-update-georesources" class="btn btn-success btn-sm" type="button" 
        [disabled]="!checkEditorPermission()" (click)="onClickBatchUpdateGeoresource()">
        <i class="fas fa-refresh"></i>&nbsp;&nbsp;Batch-Update
      </button>
      <div ngbDropdown class="d-inline-block">
        <button class="btn btn-success btn-sm" ngbDropdownToggle>+ Erstellen</button>

        <div ngbDropdownMenu class="addButton_dropdownWrapper">
          <p ngbDropdownItem (click)="onClickAddGeoresource()">POI / LOI / AOI erstellen</p>
          <p ngbDropdownItem (click)="wmsSharedComponentsService.openAddModal(WmsResourceType.GEORESOURCE)">WMS erstellen</p>
        </div>
      </div>
      <!-- edit features -->

      <!-- delete datasets -->
    </div>
  </section>

  <!-- Main content -->
  <section class="content container-fluid">

    <div ngbAccordion>
      <!-- POIs -->
      <div ngbAccordionItem>
        <h2 ngbAccordionHeader>
          <button ngbAccordionButton>Points of Interest</button>
        </h2>
        <div ngbAccordionCollapse>
          <div ngbAccordionBody>
            <ag-grid-angular 
              #poiGrid
              class="ag-theme-alpine" 
              style="height: 70vh; width: 100%;"
              [rowData]="[]"
              [columnDefs]="[]"
              [gridOptions]="poiGridOptions"
              [defaultColDef]="{
                editable: false,
                sortable: true,
                filter: true,
                floatingFilter: true,
                resizable: true,
                wrapText: true,
                autoHeight: true
              }"
              [suppressRowClickSelection]="true"
              [rowSelection]="'multiple'"
              [pagination]="true"
              [paginationPageSize]="10"
              [enableCellTextSelection]="true"
              [ensureDomOrder]="true"
              [suppressColumnVirtualisation]="true">
            </ag-grid-angular>
          </div>
        </div>
      </div>
      <!-- LOIs -->
      <div ngbAccordionItem>
        <h2 ngbAccordionHeader>
          <button ngbAccordionButton>Lines of Interest</button>
        </h2>
        <div ngbAccordionCollapse>
          <div ngbAccordionBody>
            <ag-grid-angular 
              #loiGrid
              class="ag-theme-alpine" 
              style="height: 70vh; width: 100%;"
              [rowData]="[]"
              [columnDefs]="[]"
              [gridOptions]="loiGridOptions"
              [defaultColDef]="{
                editable: false,
                sortable: true,
                filter: true,
                floatingFilter: true,
                resizable: true,
                wrapText: true,
                autoHeight: true
              }"
              [suppressRowClickSelection]="true"
              [rowSelection]="'multiple'"
              [pagination]="true"
              [paginationPageSize]="10"
              [enableCellTextSelection]="true"
              [ensureDomOrder]="true"
              [suppressColumnVirtualisation]="true">
            </ag-grid-angular>	
          </div>
        </div>
      </div>
      <!-- AOIs -->
      <div ngbAccordionItem>
        <h2 ngbAccordionHeader>
          <button ngbAccordionButton>Areas of Interest</button>
        </h2>
        <div ngbAccordionCollapse>
          <div ngbAccordionBody>
            <ag-grid-angular 
              #aoiGrid
              class="ag-theme-alpine" 
              style="height: 70vh; width: 100%;"
              [rowData]="[]"
              [columnDefs]="[]"
              [gridOptions]="aoiGridOptions"
              [defaultColDef]="{
                editable: false,
                sortable: true,
                filter: true,
                floatingFilter: true,
                resizable: true,
                wrapText: true,
                autoHeight: true
              }"
              [suppressRowClickSelection]="true"
              [rowSelection]="'multiple'"
              [pagination]="true"
              [paginationPageSize]="10"
              [enableCellTextSelection]="true"
              [ensureDomOrder]="true"
              [suppressColumnVirtualisation]="true">
            </ag-grid-angular>
          </div>
        </div>
      </div>
    </div>

    <!-- WMS -->
    <app-wms-admin-table [resourceType]="resourceType"></app-wms-admin-table>

  </section>
  <!-- /.content -->

</div>
