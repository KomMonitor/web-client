<div id="adminGeoresourcesContent">

  <div align="center">
    <div class="loading-overlay-admin-panel ng-hide" *ngIf="loadingData">
      <span class="glyphicon glyphicon-refresh icon-spin"></span>
    </div>
  </div>

  <!-- Content Header (Page header) -->
  <section class="content-header">
    <h1>
      Verwalten der Geodaten
      <small>Info</small>
    </h1>

    <div class="adminTableButtonWrapper">
      <div class="verticalAlign">
        <span>Nur editierbare Datens&auml;tze anzeigen</span>
        <div>
          <label class="switch">
            <input type="checkbox" [(ngModel)]="tableViewSwitcher" (ngModelChange)="onTableViewSwitch()">
            <span class="switchslider round"></span>
          </label>
        </div>
      </div>
      <!-- batch update georesources -->
      <button id="button-batch-update-georesources" class="btn btn-success btn-sm" type="button" 
        [disabled]="!checkEditorPermission()" (click)="onClickBatchUpdateGeoresource()">
        <i class="fas fa-refresh"></i>&nbsp;&nbsp;Batch-Update
      </button>
      <!-- add georesource -->					  		
    <!--   <button [disabled]="!checkCreatePermission()" class="btn btn-success btn-sm" type="button" 
        (click)="onClickAddGeoresource()">
        <i class="fas fa-plus"></i>&nbsp;&nbsp;Erstellen
      </button> -->
      <!-- edit metadata -->
      <div ngbDropdown class="d-inline-block">
        <button class="btn btn-success btn-sm" ngbDropdownToggle>+ Erstellen</button>

        <div ngbDropdownMenu class="addButton_dropdownWrapper">
          <button ngbDropdownItem class="btn btn-success btn-sm" (click)="onClickAddGeoresource()">POI / LOI / AOI erstellen</button>
          <button ngbDropdownItem class="btn btn-success btn-sm" (click)="wmsSharedComponentsService.openAddModal(WmsResourceType.GEORESOURCE)">WMS erstellen</button>
        </div>
      </div>
      <!-- edit features -->

      <!-- delete datasets -->
    </div>
  </section>

  <!-- Main content -->
  <section class="content container-fluid">

    <!-- WMS -->
    <app-wms-admin-table [resourceType]="resourceType"></app-wms-admin-table>
  
    <!-- POI -->

    <div class="box box-primary">
      <div class="box-header">
        <h3 class="box-title">Points of Interest</h3>

        <div class="box-tools pull-right">
          <button type="button" class="btn btn-box-tool" data-widget="collapse">
            <i class="fa fa-minus"></i>
          </button>
        </div>
      </div>

      <!-- /.box-header -->
      <div class="box-body">

        <div class="admin-table-wrapper">

          <ag-grid-angular 
            #poiGrid
            class="ag-theme-alpine" 
            style="height: 70vh; width: 100%;"
            [rowData]="[]"
            [columnDefs]="[]"
            [gridOptions]="poiGridOptions"
            [defaultColDef]="{
              editable: false,
              sortable: true,
              filter: true,
              floatingFilter: true,
              resizable: true,
              wrapText: true,
              autoHeight: true
            }"
            [suppressRowClickSelection]="true"
            [rowSelection]="'multiple'"
            [pagination]="true"
            [paginationPageSize]="10"
            [enableCellTextSelection]="true"
            [ensureDomOrder]="true"
            [suppressColumnVirtualisation]="true">
          </ag-grid-angular>	              

        </div>
      </div>
      <!-- /.box-body -->
    </div>
    <!-- /.box -->

    <!-- LOI -->

    <div class="box box-primary">
      <div class="box-header">
        <h3 class="box-title">Lines of Interest</h3>

        <div class="box-tools pull-right">
          <button type="button" class="btn btn-box-tool" data-widget="collapse">
            <i class="fa fa-minus"></i>
          </button>
        </div>
      </div>
      <!-- /.box-header -->
      <div class="box-body">

        <div class="admin-table-wrapper">

          <ag-grid-angular 
            #loiGrid
            class="ag-theme-alpine" 
            style="height: 70vh; width: 100%;"
            [rowData]="[]"
            [columnDefs]="[]"
            [gridOptions]="loiGridOptions"
            [defaultColDef]="{
              editable: false,
              sortable: true,
              filter: true,
              floatingFilter: true,
              resizable: true,
              wrapText: true,
              autoHeight: true
            }"
            [suppressRowClickSelection]="true"
            [rowSelection]="'multiple'"
            [pagination]="true"
            [paginationPageSize]="10"
            [enableCellTextSelection]="true"
            [ensureDomOrder]="true"
            [suppressColumnVirtualisation]="true">
          </ag-grid-angular>	 										

        </div>
      </div>
      <!-- /.box-body -->
    </div>
    <!-- /.box -->

    <!-- AOI -->

    <div class="box box-primary">
      <div class="box-header">
        <h3 class="box-title">Areas of Interest</h3>

        <div class="box-tools pull-right">
          <button type="button" class="btn btn-box-tool" data-widget="collapse">
            <i class="fa fa-minus"></i>
          </button>
        </div>
      </div>
      <!-- /.box-header -->
      <div class="box-body">

        <div class="admin-table-wrapper">

          <ag-grid-angular 
            #aoiGrid
            class="ag-theme-alpine" 
            style="height: 70vh; width: 100%;"
            [rowData]="[]"
            [columnDefs]="[]"
            [gridOptions]="aoiGridOptions"
            [defaultColDef]="{
              editable: false,
              sortable: true,
              filter: true,
              floatingFilter: true,
              resizable: true,
              wrapText: true,
              autoHeight: true
            }"
            [suppressRowClickSelection]="true"
            [rowSelection]="'multiple'"
            [pagination]="true"
            [paginationPageSize]="10"
            [enableCellTextSelection]="true"
            [ensureDomOrder]="true"
            [suppressColumnVirtualisation]="true">
          </ag-grid-angular>	 

        </div>
      </div>
      <!-- /.box-body -->
    </div>
    <!-- /.box -->

  </section>
  <!-- /.content -->

</div>
