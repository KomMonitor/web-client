<app-admin-content-view
  [title]="'ADMIN_INDICATORS.OVERVIEW.TITLE' | translate"
  [description]="'ADMIN_SHARED.INFO' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>
<ng-template #controls>
  <div>{{ 'ADMIN_SHARED.SHOW_ONLY_EDITABLE' | translate }}</div>
  <div>
    <label class="switch">
      <input
        type="checkbox"
        [(ngModel)]="tableViewSwitcher"
        (ngModelChange)="onTableViewSwitch()"
      />
      <span class="switchslider round"></span>
    </label>
  </div>
  <button
    id="button-batch-update-indicators"
    class="btn btn-success btn-sm"
    type="button"
    [disabled]="!checkEditorPermission()"
    (click)="onClickBatchUpdate()"
  >
    <i class="fas fa-refresh"></i>&nbsp;&nbsp;{{ 'ADMIN_INDICATORS.BATCH_UPDATE' | translate }}
  </button>
  <div ngbDropdown class="d-inline-block">
    <button class="btn btn-success btn-sm" ngbDropdownToggle>
      + {{ 'ADMIN_SHARED.CREATE' | translate }}
    </button>

    <div ngbDropdownMenu class="addButton_dropdownWrapper">
      <button ngbDropdownItem type="button" (click)="openAddIndicatorModal()">
        {{ 'ADMIN_INDICATORS.OVERVIEW.CREATE_INDICATOR' | translate }}
      </button>
      <button
        ngbDropdownItem
        type="button"
        (click)="wmsSharedComponentsService.openAddModal(WmsResourceType.INDICATOR)"
      >
        {{ 'ADMIN_INDICATORS.OVERVIEW.CREATE_WMS' | translate }}
      </button>
    </div>
  </div>
  <!-- delete selected completely -->
  <button
    class="btn btn-danger btn-sm"
    type="button"
    [disabled]="!checkDeletePermission()"
    (click)="openDeleteIndicatorModal()"
  >
    <i class="fas fa-trash"></i>&nbsp;&nbsp;{{ 'ADMIN_SHARED.DELETE' | translate }}
  </button>
</ng-template>

<ng-template #content>
  <expandable-box [title]="'ADMIN_INDICATORS.OVERVIEW.METADATA_BOX' | translate">
    <ag-grid-angular
      #agGrid
      style="height: 70vh"
      class="ag-theme-alpine"
      [columnDefs]="columnDefs()"
      [rowData]="rowData()"
      [gridOptions]="gridOptions"
    >
    </ag-grid-angular>
  </expandable-box>

  <app-wms-admin-table [resourceType]="resourceType"></app-wms-admin-table>

  <!-- <expandable-box title="Indikatoren-Reihenfolge in Themenkatalog">
    TODO: add topic comp once ready
  </expandable-box> -->
</ng-template>
