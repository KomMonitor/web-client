<div>
  <h2 class="fs-title text-center">{{ 'ADMIN_SHARED_UI.TOPICS.TITLE' | translate }}</h2>
  <h3 class="fs-subtitle text-center">{{ 'ADMIN_INDICATORS.STEP_TOPICS.SUBTITLE' | translate }}</h3>
  <p class="text-center">
    <b
      ><i>{{ 'ADMIN_SHARED_UI.STEP.REQUIRED_FIELD_MARKER' | translate }}</i></b
    >
  </p>
  <app-topic-hierarchy-form
    [form]="state.addForm.controls.topics"
    [availableTopics]="state.availableTopics"
    idPrefix="ind-topics"
  />
  @if (accessControlService.checkAdminPermission()) {
    <hr />
    <br />
    <div class="row vertical-align">
      <div class="col-md-10 col-sm-12 col-12">
        <!--
          <expandable-box> instead of the AdminLTE `box box-primary collapsed-box`
          markup this used to be. The collapse itself worked here — unlike the four
          georesource and WMS dialogs, it had been rewired to `ngbCollapse` with a
          hand-swapped fa-plus/fa-minus icon — but the shared component does the
          same thing, and its `.box-*` classes were unstyled in this dialog, so the
          title rendered at Bootstrap's 28px <h3>, larger than the 20px dialog
          title above it.

          `variant="nested"` is the shared component's subordinate look (15px/600
          title, no shadow): this panel manages the global topic catalog and is not
          part of the form around it. It starts collapsed, as `collapsed-box` and
          `isIndicatorAddTopicsCollapse = true` both meant.
        -->
        <expandable-box
          [title]="'ADMIN_SHARED_UI.TOPICS.TOPIC_CATALOG' | translate"
          variant="nested"
        >
          <app-admin-topics-management></app-admin-topics-management>
        </expandable-box>
      </div>
    </div>
  }
