<div>
  <h2 class="fs-title">{{ 'ADMIN_SHARED_UI.TOPICS.TITLE' | translate }}</h2>
  <h3 class="fs-subtitle">{{ 'ADMIN_INDICATORS.STEP_TOPICS.SUBTITLE' | translate }}</h3>
  <p>
    <b
      ><i>{{ 'ADMIN_SHARED_UI.STEP.REQUIRED_FIELD_MARKER' | translate }}</i></b
    >
  </p>
  <app-topic-hierarchy-form
    [form]="state.addForm.controls.topics"
    [availableTopics]="state.availableTopics"
    idPrefix="ind-topics"
  />
  @if (accessControlService.checkAdminPermission()) {
    <hr />
    <br />
    <div class="row vertical-align">
      <div class="col-md-10 col-sm-12 col-12">
        <div style="text-align: left">
          <div
            id="indicatorAddAdmin_topicsManagement"
            class="box box-primary collapsed-box"
            style="background: #ebf0fd"
          >
            <div class="box-header">
              <h3 class="box-title">
                {{ 'ADMIN_SHARED_UI.TOPICS.TOPIC_CATALOG' | translate }}
              </h3>
              <div class="box-tools pull-right">
                <button
                  type="button"
                  (click)="indicatorAddTopicsCollapse.toggle()"
                  class="btn btn-box-tool"
                  data-widget="collapse"
                >
                  <i
                    class="fa"
                    [ngClass]="{
                      'fa-plus': isIndicatorAddTopicsCollapse,
                      'fa-minus': !isIndicatorAddTopicsCollapse,
                    }"
                  ></i>
                </button>
              </div>
            </div>
            <div
              class="box-body"
              #indicatorAddTopicsCollapse="ngbCollapse"
              [(ngbCollapse)]="isIndicatorAddTopicsCollapse"
            >
              <app-admin-topics-management></app-admin-topics-management>
            </div>
          </div>
        </div>
      </div>
    </div>
  }

  />
