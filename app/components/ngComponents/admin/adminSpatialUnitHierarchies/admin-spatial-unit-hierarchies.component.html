<app-admin-content-view
  [title]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.OVERVIEW.TITLE' | translate"
  [description]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.OVERVIEW.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<ng-template #controls>
  <div class="form-check form-switch">
    <input
      class="form-check-input"
      type="checkbox"
      id="spatial-unit-hierarchies-show-ids"
      [checked]="showIds()"
      (change)="onShowIdsChange($event)"
    />
    <label class="form-check-label" for="spatial-unit-hierarchies-show-ids">
      {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.SHOW_IDS' | translate }}
    </label>
  </div>
</ng-template>

<ng-template #content>
  <div class="alert alert-info">
    {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.OVERVIEW.PLACEHOLDER' | translate }}
  </div>

  @for (hierarchy of hierarchies; track hierarchy.id) {
    <app-collapsible-section
      [title]="hierarchy.name"
      [meta]="
        'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.LEVEL_COUNT'
          | translate: { count: hierarchy.levelCount() }
      "
      [idLabel]="hierarchy.id"
      [showId]="showIds()"
      [(open)]="hierarchy.open"
    >
      <button
        header-actions
        type="button"
        class="btn btn-sm btn-warning"
        (click)="onAction('ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.EDIT', hierarchy.name)"
      >
        {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.EDIT' | translate }}
      </button>
      <button
        header-actions
        type="button"
        class="btn btn-sm btn-danger"
        (click)="onAction('ADMIN_SHARED.DELETE', hierarchy.name)"
      >
        {{ 'ADMIN_SHARED.DELETE' | translate }}
      </button>

      <app-tree-view
        [nodes]="hierarchy.levels()"
        [idOf]="levelId"
        [childrenOf]="levelChildren"
        indentMode="row"
        [(expandedIds)]="hierarchy.expandedIds"
        [insertLabel]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.INSERT_LEVEL' | translate"
        [canInsertAt]="leadingGapOnly"
        [(openGap)]="hierarchy.openGap"
        [toggleLabel]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.TOGGLE_LABEL' | translate"
      >
        <ng-template appTreeRow let-level let-depth="depth">
          <span class="level-rank">
            {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.LEVEL_RANK' | translate: { rank: depth + 1 } }}
          </span>
          <span class="level-name">{{ level.name }}</span>
          @if (showIds()) {
            <span class="level-id">{{ level.id }}</span>
          }
          <span class="level-spacer"></span>
          <button
            type="button"
            class="level-move"
            [disabled]="!canMove(hierarchy, level, -1)"
            [title]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.MOVE_UP' | translate"
            (click)="$event.stopPropagation(); moveLevel(hierarchy, level, -1)"
          >
            <span aria-hidden="true">&#9650;</span>
            <span class="visually-hidden">
              {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.MOVE_UP' | translate }}
            </span>
          </button>
          <button
            type="button"
            class="level-move"
            [disabled]="!canMove(hierarchy, level, 1)"
            [title]="'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.MOVE_DOWN' | translate"
            (click)="$event.stopPropagation(); moveLevel(hierarchy, level, 1)"
          >
            <span aria-hidden="true">&#9660;</span>
            <span class="visually-hidden">
              {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.MOVE_DOWN' | translate }}
            </span>
          </button>
          <button
            type="button"
            class="btn btn-sm btn-warning"
            (click)="$event.stopPropagation(); onAction('ADMIN_SHARED.METADATA', level.name)"
          >
            {{ 'ADMIN_SHARED.METADATA' | translate }}
          </button>
          <button
            type="button"
            class="btn btn-sm btn-outline-danger"
            [disabled]="hierarchy.levelCount() === 1"
            (click)="$event.stopPropagation(); removeLevel(hierarchy, level)"
          >
            {{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.REMOVE' | translate }}
          </button>
        </ng-template>
        <ng-template appTreeGap let-gap let-close="close">
          <app-level-picker-panel [hierarchy]="hierarchy" [gap]="gap" (done)="close()" />
        </ng-template>
      </app-tree-view>

      <!-- Live view of what the tree renders: moving a level rewrites it. -->
      <figure class="json-view">
        <figcaption>{{ 'ADMIN_SPATIAL_UNIT_HIERARCHIES.DEMO.JSON_TITLE' | translate }}</figcaption>
        <pre>{{ hierarchy.json() }}</pre>
      </figure>
    </app-collapsible-section>
  }
</ng-template>
