<app-admin-content-view
  [title]="'ADMIN_SCRIPTS.EXECUTION.TITLE' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<ng-template #controls>
  <button class="btn btn-warning btn-sm" type="button" (click)="refreshJobOverviewTable()">
    <i class="fas fa-sync-alt"></i> {{ 'ADMIN_SCRIPTS.EXECUTION.REFRESH' | translate }}
  </button>
</ng-template>

<ng-template #content>
  @if (loginRequired()) {
    <div class="alert alert-info" role="alert">
      <i class="fas fa-circle-info"></i>
      {{ 'ADMIN_SCRIPTS.EXECUTION.LOGIN_REQUIRED' | translate }}
    </div>
  } @else {
    <app-loading-overlay
      [loading]="loadingData()"
      [message]="'ADMIN_SHARED.LOADING_DATA' | translate"
    >
      <!--
        Five tiles, so not the four-column grid the dashboard uses: `col-lg`
        gives them equal shares of one row from lg up and falls back to two per
        row below that. `.vertical-align` is deliberately absent — it centres
        the last flex line, which left the fifth tile floating mid-row.
      -->
      <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg">
          <app-small-box
            [titleText]="totalJobs().toString()"
            [descriptionText]="'ADMIN_SCRIPTS.EXECUTION.TOTAL_JOBS' | translate"
            boxColor="#337ab7"
            iconClass="fas fa-file-code"
          ></app-small-box>
        </div>
        @for (tile of statusTiles; track tile.status) {
          <div class="col-12 col-sm-6 col-lg">
            <app-small-box
              [titleText]="countFor(tile.status).toString()"
              [descriptionText]="tile.labelKey | translate"
              [boxColor]="tile.color"
              iconClass="fas fa-file-code"
              [clickable]="true"
              (boxClick)="showJobsForStatus(tile)"
            ></app-small-box>
          </div>
        }
      </div>

      <expandable-box
        class="d-block mt-3"
        [title]="tableTitle()"
        [collapsed]="tableCollapsed()"
        (collapsedChange)="onTableCollapsedChange($event)"
        [borderColor]="selectedTile()?.boxColor ?? 'primary'"
      >
        @if (selectedStatus()) {
          <div class="mb-2">
            <button
              type="button"
              class="btn btn-sm btn-outline-secondary"
              (click)="clearStatusFilter()"
            >
              <i class="fas fa-xmark"></i>&nbsp;{{
                'ADMIN_SCRIPTS.EXECUTION.CLEAR_FILTER' | translate
              }}
            </button>
          </div>
        }

        <!--
          Built on first expand only: the box keeps its content alive while
          collapsed, so an unguarded table would fetch the summaries on every
          page visit.
        -->
        @if (tableOpened()) {
          <app-job-overview-table [rows]="filteredRows()" height="fill" />
        }
      </expandable-box>
    </app-loading-overlay>
  }
</ng-template>
