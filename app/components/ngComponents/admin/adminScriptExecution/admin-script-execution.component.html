<app-admin-content-view
  [title]="'ADMIN_SCRIPTS.EXECUTION.TITLE' | translate"
  [description]="'ADMIN_SCRIPTS.EXECUTION.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
>
</app-admin-content-view>

<ng-template #controls>
  <button class="btn btn-warning btn-sm" type="button" (click)="refreshJobOverviewTable()">
    <i class="fas fa-sync-alt"></i> {{ 'ADMIN_SCRIPTS.EXECUTION.REFRESH' | translate }}
  </button>
</ng-template>

<ng-template #content>
  @if (loginRequired()) {
    <div class="alert alert-info" role="alert">
      <i class="fas fa-circle-info"></i>
      {{ 'ADMIN_SCRIPTS.EXECUTION.LOGIN_REQUIRED' | translate }}
    </div>
  } @else {
    <app-loading-overlay
      [loading]="loadingData()"
      [message]="'ADMIN_SHARED.LOADING_DATA' | translate"
    >
      <!--
        Five tiles, so not the four-column grid the dashboard uses: `col-lg`
        gives them equal shares of one row from lg up and falls back to two per
        row below that. `.vertical-align` is deliberately absent — it centres
        the last flex line, which left the fifth tile floating mid-row.
      -->
      <div class="row g-3">
        <div class="col-12 col-sm-6 col-lg">
          <app-small-box
            [titleText]="totalJobs().toString()"
            [descriptionText]="'ADMIN_SCRIPTS.EXECUTION.TOTAL_JOBS' | translate"
            boxColor="#337ab7"
            iconClass="fas fa-file-code"
          ></app-small-box>
        </div>
        @for (tile of statusTiles; track tile.status) {
          <div class="col-12 col-sm-6 col-lg">
            <app-small-box
              [titleText]="countFor(tile.status).toString()"
              [descriptionText]="tile.labelKey | translate"
              [boxColor]="tile.color"
              iconClass="fas fa-file-code"
              [clickable]="true"
              (boxClick)="openJobsForStatus(tile)"
            ></app-small-box>
          </div>
        }
      </div>

      <p class="text-muted mt-3">{{ 'ADMIN_SCRIPTS.EXECUTION.TILE_HINT' | translate }}</p>
    </app-loading-overlay>
  }
</ng-template>
