<app-admin-content-view
  [title]="'ADMIN_SCRIPTS.MANAGEMENT.TITLE' | translate"
  [description]="'ADMIN_SCRIPTS.MANAGEMENT.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
></app-admin-content-view>

<ng-template #controls>
  <!-- TODO: gate this button on AccessControlService.checkCreatePermission() -->
  <button class="btn btn-success btn-sm" type="button" (click)="onClickAddScript()">
    <i class="fas fa-plus"></i> {{ 'ADMIN_SHARED.CREATE' | translate }}
  </button>

  <!-- TODO: additionally gate this button on AccessControlService.checkDeletePermission() -->
  <button
    class="btn btn-danger btn-sm"
    type="button"
    [disabled]="selectedRows().length === 0"
    (click)="onClickDeleteScripts()"
  >
    <i class="fas fa-trash"></i> {{ 'ADMIN_SHARED.DELETE' | translate }}
  </button>
</ng-template>

<ng-template #content>
  <app-loading-overlay [loading]="loadingData()">
    <expandable-box
      [title]="'ADMIN_SCRIPTS.MANAGEMENT.BOX_TITLE' | translate"
      [isCollapsible]="false"
    >
      <!--
        Selection is configured through `gridOptions` alone (it already carries
        `rowSelection: 'multiple'`). A second `rowSelection` binding on the
        element silently suppressed the `selectionChanged` output, so the
        toolbar's delete button never left its disabled state.
      -->
      <ag-grid-angular
        id="scriptOverviewTable"
        style="height: 70vh"
        class="ag-theme-alpine"
        [columnDefs]="columnDefs"
        [defaultColDef]="defaultColDef"
        [rowData]="rowData()"
        [gridOptions]="gridOptions"
        (selectionChanged)="onSelectionChanged($event)"
      ></ag-grid-angular>
    </expandable-box>
  </app-loading-overlay>
</ng-template>
