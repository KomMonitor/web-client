<app-admin-content-view
  [title]="'ADMIN_SCRIPTS.MANAGEMENT.TITLE' | translate"
  [description]="'ADMIN_SCRIPTS.MANAGEMENT.DESCRIPTION' | translate"
  [controlsTemplate]="controls"
  [contentTemplate]="content"
></app-admin-content-view>

<ng-template #controls>
  <!-- Also why the list stays empty: without the role the API refuses reading it. -->
  @if (!canManageSchedules()) {
    <span class="create-blocked">
      {{ 'ADMIN_SCRIPTS.MANAGEMENT.NO_PERMISSION_HINT' | translate }}
    </span>
  }
  <button
    class="btn btn-success btn-sm"
    type="button"
    [disabled]="!canManageSchedules()"
    (click)="onClickAddScript()"
  >
    <i class="fas fa-plus"></i> {{ 'ADMIN_SHARED.CREATE' | translate }}
  </button>

  <button
    class="btn btn-danger btn-sm"
    type="button"
    [disabled]="!canManageSchedules() || selectedRows().length === 0"
    (click)="onClickDeleteScripts()"
  >
    <i class="fas fa-trash"></i> {{ 'ADMIN_SHARED.DELETE' | translate }}
  </button>
</ng-template>

<ng-template #content>
  <app-loading-overlay [loading]="loadingData()">
    <expandable-box
      [title]="'ADMIN_SCRIPTS.MANAGEMENT.BOX_TITLE' | translate"
      [isCollapsible]="false"
    >
      <!-- Both toggles rebuild the column set; they add columns, not filters. -->
      <div class="d-flex gap-4 mb-3">
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="toggleScriptIds"
            [checked]="showScriptIds()"
            (change)="onToggleScriptIds()"
          />
          <label class="form-check-label" for="toggleScriptIds">
            {{ 'ADMIN_SCRIPTS.MANAGEMENT.SHOW_IDS' | translate }}
          </label>
        </div>
        <div class="form-check form-switch">
          <input
            class="form-check-input"
            type="checkbox"
            id="toggleProcessDescription"
            [checked]="showProcessDescription()"
            (change)="onToggleProcessDescription()"
          />
          <label class="form-check-label" for="toggleProcessDescription">
            {{ 'ADMIN_SCRIPTS.MANAGEMENT.SHOW_METHODOLOGY' | translate }}
          </label>
        </div>
      </div>
      <!--
        Selection is configured through `gridOptions` alone (it already carries
        `rowSelection: 'multiple'`). A second `rowSelection` binding on the
        element silently suppressed the `selectionChanged` output, so the
        toolbar's delete button never left its disabled state.
      -->
      <ag-grid-angular
        id="scriptOverviewTable"
        style="height: 70vh"
        class="ag-theme-alpine"
        [columnDefs]="columnDefs()"
        [defaultColDef]="defaultColDef"
        [rowData]="rowData()"
        [gridOptions]="gridOptions"
        (selectionChanged)="onSelectionChanged($event)"
      ></ag-grid-angular>
    </expandable-box>
  </app-loading-overlay>
</ng-template>
