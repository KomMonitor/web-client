<div class="script-definition-wrapper">
  <div class="wrapper-header">
    <h4 class="wrapper-title">{{ title }}</h4>
    @if (description) {
      <p class="fs-subtitle text-center">{{ description }}</p>
    }
  </div>

  <div class="wrapper-content">
    @if (content) {
      <ng-container *ngTemplateOutlet="content"></ng-container>
    } @else {
      <ng-content></ng-content>
    }
  </div>
</div>
