<div class="label">
  <b
    ><i>{{ 'ADMIN_SCRIPTS.REQUIRED_FIELD_HINT' | translate }}</i></b
  >
</div>

<div class="row">
  <div class="col-md-4 col-sm-6">
    <div class="form-group">
      <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.NAME_LABEL' | translate }}</label>
      <input
        type="text"
        class="form-control"
        [ngModel]="metadata.name"
        (ngModelChange)="updateName($event)"
        [placeholder]="'ADMIN_SHARED.NAME' | translate"
        required
      />
      <div class="help-block">
        <p>{{ 'ADMIN_SCRIPTS.METADATA_STEP.NAME_HELP' | translate }}</p>
      </div>
    </div>
  </div>
  <div class="col-md-8 col-sm-6">
    <div class="form-group">
      <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.DESCRIPTION_LABEL' | translate }}</label>
      <textarea
        rows="3"
        class="form-control"
        [ngModel]="metadata.description"
        (ngModelChange)="updateDescription($event)"
        [placeholder]="'ADMIN_SHARED.DESCRIPTION' | translate"
        required
      ></textarea>
      <div class="help-block">
        <p>{{ 'ADMIN_SCRIPTS.METADATA_STEP.DESCRIPTION_HELP' | translate }}</p>
      </div>
    </div>
  </div>
</div>

<div class="row">
  <div class="col-md-6 col-sm-6">
    <div class="form-group">
      <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.TARGET_INDICATOR_LABEL' | translate }}</label>
      <div class="input-group mb-2">
        <span class="input-group-text"><i class="fas fa-filter"></i></span>
        <input
          type="text"
          class="form-control form-control-sm"
          [placeholder]="'ADMIN_SHARED.KEYWORD_FILTER' | translate"
          [(ngModel)]="indicatorNameFilter"
        />
      </div>
      <select
        size="5"
        class="form-control"
        [ngModel]="metadata.associatedIndicatorId"
        (ngModelChange)="updateTargetIndicator($event)"
      >
        <option disabled [ngValue]="null">
          {{ 'ADMIN_SCRIPTS.METADATA_STEP.SELECT_TARGET_INDICATOR_PLACEHOLDER' | translate }}
        </option>
        @for (indicator of filteredComputationIndicators; track indicator) {
          <option [ngValue]="indicator">
            {{ indicator.indicatorName }} [{{ indicator.unit }}]
          </option>
        }
      </select>
      <div class="help-block">
        <p>{{ 'ADMIN_SCRIPTS.METADATA_STEP.TARGET_INDICATOR_HELP' | translate }}</p>
      </div>
    </div>
  </div>

  <div class="col-md-6 col-sm-6">
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.SELECTED_ID_LABEL' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            disabled
            [value]="targetIndicator?.indicatorId"
          />
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.SELECTED_NAME_LABEL' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            disabled
            [value]="targetIndicator?.indicatorName"
          />
        </div>
      </div>
    </div>
    <div class="row">
      <div class="col-md-6">
        <div class="form-group">
          <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.SELECTED_DESCRIPTION_LABEL' | translate }}</label>
          <textarea
            rows="4"
            class="form-control form-control-sm"
            disabled
            [value]="targetIndicator?.metadata?.description"
          ></textarea>
        </div>
      </div>
      <div class="col-md-6">
        <div class="form-group">
          <label>{{ 'ADMIN_SCRIPTS.METADATA_STEP.SELECTED_UNIT_LABEL' | translate }}</label>
          <input
            type="text"
            class="form-control form-control-sm"
            disabled
            [value]="targetIndicator?.unit"
          />
        </div>
      </div>
    </div>
  </div>
</div>
