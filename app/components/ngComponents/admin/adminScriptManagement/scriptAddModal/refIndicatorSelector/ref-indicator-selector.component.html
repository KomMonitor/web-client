<div class="card mb-3">
  <div class="card-header">
    <h5>{{ label }}</h5>
  </div>
  <div class="card-body">
    <div class="form-group">
      <label>{{ 'ADMIN_SCRIPTS.REF_INDICATOR.SELECT_LABEL' | translate }}</label>
      <select
        class="form-control form-control-sm"
        size="4"
        [ngModel]="selection"
        (ngModelChange)="selectionChange.emit($event)"
      >
        <option disabled [ngValue]="null">
          {{ 'ADMIN_SCRIPTS.SELECT_INDICATOR_PLACEHOLDER' | translate }}
        </option>
        @for (ind of availableIndicators; track ind) {
          <option [ngValue]="ind">
            {{ ind.indicatorName }}
          </option>
        }
      </select>
    </div>
    @if (selection) {
      <div class="mt-2">
        <span class="badge bg-info">{{ selection.indicatorName }}</span>
      </div>
    }
  </div>
</div>
