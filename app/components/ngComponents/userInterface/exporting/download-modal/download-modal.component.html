<div class="modal-content">
  <div class="modal-header">
    <h4 class="modal-title"><b>Downloadbereich</b></h4>
    <button
      type="button"
      class="btn-close"
      aria-label="Close"
      (click)="activeModal.close('Close click')"
    ></button>
  </div>
  <div class="modal-body">
    <p class="hint">
      Konfigurieren und starten Sie den Export Ihrer ausgewählten Datensätze.
    </p>

    <div class="row">
      <div class="col-md-4">
        <expandable-box
          title="Kombinierter Export"
          [collapsed]="false"
          [isCollapsible]="false"
        >
          <app-export-typ-selection />
        </expandable-box>

        <expandable-box
          title="Export starten"
          [collapsed]="false"
          [isCollapsible]="false"
        >
          <app-epsg-selector
            (epsgCodeChange)="onEpsgCodeChange($event)"
            class="mb-3 d-block"
          />
          <div class="d-grid">
            <button
              type="button"
              class="btn btn-primary"
              [disabled]="srvc.selectedEpsgCode() === null"
              (click)="startDownload()"
            >
              <i class="fas fa-download"></i>
              <span> Download starten</span>
            </button>
          </div>
        </expandable-box>
      </div>
      <div class="col-md-8">
        <expandable-box
          title="Ausgewählte Datensätze"
          [collapsed]="false"
          [isCollapsible]="false"
        >
          <app-export-dataset-list />
        </expandable-box>
      </div>
    </div>
  </div>
</div>
