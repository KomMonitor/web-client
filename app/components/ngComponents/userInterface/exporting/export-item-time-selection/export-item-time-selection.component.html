<div>Zeitpunkt(e)</div>

<ul
  ngbNav
  #nav="ngbNav"
  [(activeId)]="active"
  class="nav nav-tabs"
  [animation]="false"
  (navChange)="onTabChange($event.nextId)"
>
  <li [ngbNavItem]="1">
    <a class="nav-link" ngbNavLink>Einzeln</a>
    <ng-template ngbNavContent>
      <p>einzelnen Zeitpunkt auswählen</p>
      <select
        (change)="updateSingleTimestamp($event)"
        [value]="singleValue"
        class="form-select"
      >
        <option value="">Bitte wählen...</option>
        <option
          *ngFor="let ts of exportItem.dataset.availableTimestamps"
          [value]="ts"
        >
          {{ ts }}
        </option>
      </select>
    </ng-template>
  </li>
  <li [ngbNavItem]="2">
    <a class="nav-link" ngbNavLink>Zeitraum</a>
    <ng-template ngbNavContent>
      <div class="row">
        <div class="col-md-6">
          <div>Von</div>
          <select
            (change)="updateRangeStart($event)"
            [value]="rangeStart"
            class="form-select"
          >
            <option value="">Bitte wählen...</option>
            <option
              *ngFor="let ts of exportItem.dataset.availableTimestamps"
              [value]="ts"
            >
              {{ ts }}
            </option>
          </select>
        </div>
        <div class="col-md-6">
          <div>Bis</div>
          <select
            (change)="updateRangeEnd($event)"
            [value]="rangeEnd"
            class="form-select"
          >
            <option value="">Bitte wählen...</option>
            <option
              *ngFor="let ts of exportItem.dataset.availableTimestamps"
              [value]="ts"
            >
              {{ ts }}
            </option>
          </select>
        </div>
      </div>
    </ng-template>
  </li>
</ul>

<div [ngbNavOutlet]="nav" class="mt-2"></div>
