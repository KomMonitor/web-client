<button
  type="button"
  style="display: block; position: relative; margin-top: 5px"
  (click)="openExportMenuModal()"
  class="btn btn-custom btn-circle"
  data-toggle="modal"
  title="Downloadbereich öffnen"
>
  <i class="fas fa-file-download"></i>
  <span
    *ngIf="exportItemCount() > 0"
    class="badge badge-pill export-item-badge"
    >{{ exportItemCount() }}</span
  >
</button>
