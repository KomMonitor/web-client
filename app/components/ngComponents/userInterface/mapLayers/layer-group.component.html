<section class="layer-group" [class.layer-group--top]="depth() === 0">
  <button
    type="button"
    class="layer-group__header"
    [attr.aria-expanded]="expanded()"
    [attr.aria-controls]="bodyId()"
    (click)="toggle()"
  >
    <i
      class="fas layer-group__chevron"
      [class.fa-chevron-down]="expanded()"
      [class.fa-chevron-right]="!expanded()"
      aria-hidden="true"
    ></i>
    <span class="layer-group__title">{{ node().group.i18nKey | translate }}</span>
    <span
      class="layer-group__badge"
      [attr.aria-label]="'MAP_LAYERS.GROUP.COUNT' | translate: { count: node().count }"
      >{{ node().count }}</span
    >
  </button>

  @if (expanded()) {
    <div class="layer-group__body" [id]="bodyId()">
      @for (child of node().children; track child.group.id) {
        @if (isGroupShown(child)) {
          <app-layer-group [node]="child" [depth]="depth() + 1" />
        }
      }
      @for (entry of node().entries; track entry.id) {
        <app-layer-row [entry]="entry" />
      }
      @if (node().count === 0 && node().group.emptyHintI18nKey; as hint) {
        <p class="layer-group__hint">{{ hint | translate }}</p>
      }
    </div>
  }
</section>
