<div class="layer-row" [class.layer-row--hidden]="!entry().visible" [title]="fullName()">
  <button
    type="button"
    class="layer-row__eye"
    [attr.aria-pressed]="entry().visible"
    [attr.aria-label]="'MAP_LAYERS.ROW.TOGGLE' | translate: { title: entry().title }"
    (click)="toggleVisible()"
  >
    <i class="fas" [class.fa-eye]="entry().visible" [class.fa-eye-slash]="!entry().visible"></i>
  </button>
  <app-layer-symbol class="layer-row__symbol" [symbol]="entry().symbol" />
  <span class="layer-row__name">
    {{ entry().title }}
    @if (entry().subtitle) {
      <span class="layer-row__subtitle">{{ entry().subtitle }}</span>
    }
  </span>
  @if (entry().status === 'loading') {
    <i
      class="fas fa-spinner fa-spin layer-row__state"
      role="img"
      [attr.aria-label]="'MAP_LAYERS.STATUS.LOADING' | translate"
      [title]="'MAP_LAYERS.STATUS.LOADING' | translate"
    ></i>
  }
  @if (entry().status === 'error') {
    <i
      class="fas fa-triangle-exclamation layer-row__state layer-row__state--error"
      role="img"
      [attr.aria-label]="'MAP_LAYERS.STATUS.ERROR' | translate"
      [title]="'MAP_LAYERS.STATUS.ERROR' | translate"
    ></i>
  }
  @if (entry().outOfScale) {
    <i
      class="fas fa-magnifying-glass-minus layer-row__state"
      role="img"
      [attr.aria-label]="'MAP_LAYERS.STATUS.OUT_OF_SCALE' | translate"
      [title]="'MAP_LAYERS.STATUS.OUT_OF_SCALE' | translate"
    ></i>
  }
</div>
