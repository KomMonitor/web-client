<div id="poi">
  <div style="text-align: center">
    <div
      class="loading-overlay-sidebar-small ng-hide"
      *ngIf="layerService.loadingData"
    >
      <span class="glyphicon glyphicon-refresh icon-spin"></span>
    </div>
  </div>

  <expandable-box [title]="'Georessourcenauswahl'" [collapsed]="false">
    <div style="text-align: center">
      <b
        title="Checkbox zur Wahl, ob die einzelnen Punkte eines POI Layers geclustered werden sollen"
        >Points of Interest clustern</b
      >
      (Zusammenfassung mehrerer Punkte je nach Zoomstufe) &nbsp;
      <label class="switch">
        <input
          type="checkbox"
          value="useCluster"
          [(ngModel)]="layerService.useCluster"
          (change)="layerService.refreshPoiLayers()"
          checked
        />
        <span class="switchslider round"></span>
      </label>

      <br />

      <label>
        <b title="Auswahl zur Größe der POI-Marker"
          >Größe der Points of Interest</b
        >
        &nbsp;

        <select
          (change)="layerService.refreshPoiLayers()"
          [(ngModel)]="dataExchangeService.selectedPoiSize"
          class="form-control"
        >
          <option *ngFor="let item of poiSizes" [ngValue]="item">
            {{ item.label }}
          </option>
        </select>
      </label>
    </div>

    <hr />
    <br />

    <div class="input-wrapper">
      <span class="icon"><i class="fas fa-filter"></i></span>
      <input
        type="text"
        class="form-control input-sm"
        placeholder="Stichwortfilter"
        [(ngModel)]="filterService.georesourceNameFilter.value"
        (keyup)="filterService.onChangeGeoresourceKeywordFilter()"
      />
    </div>

    <br />

    <ul class="nav nav-tabs" id="poiTabs" role="tablist">
      <li class="nav-item active">
        <a
          class="nav-link active"
          id="poiTab1"
          data-bs-toggle="tab"
          data-bs-target="#poiTab1Content"
          role="tab"
          aria-controls="poiTab1Content"
          aria-selected="true"
          >Datenkatalog</a
        >
      </li>
      <li class="nav-item">
        <a
          class="nav-link"
          id="poiTab2"
          data-bs-toggle="tab"
          data-bs-target="#poiTab2Content"
          role="tab"
          aria-controls="poiTab2Content"
          aria-selected="false"
          >Alphabetische Listen</a
        >
      </li>
      <li class="nav-item" *ngIf="showFavSelection">
        <a
          class="nav-link"
          id="poiTab3"
          data-bs-toggle="tab"
          data-bs-target="#poiTab3Content"
          role="tab"
          aria-controls="poiTab3Content"
          aria-selected="false"
          >Favoriten</a
        >
      </li>
    </ul>
    <div class="tab-content">
      <div
        class="tab-pane active"
        id="poiTab1Content"
        role="tabpanel"
        aria-labelledby="poiTab1"
      >
        <app-georesource-catalogue-tab
          [showFavSelection]="showFavSelection"
          (toggleGeoresourceOnMap)="handleGeoresourceOnMap($event)"
          (showAllOnTopic)="handleShowAllOnTopic($event, 'list')"
          (zoomToLayer)="zoomToLayer($event)"
        >
        </app-georesource-catalogue-tab>
      </div>

      <div
        class="tab-pane"
        id="poiTab2Content"
        role="tabpanel"
        aria-labelledby="poiTab2"
      >
        <app-georesource-list-tab
          [showFavSelection]="showFavSelection"
          (toggleGeoresourceOnMap)="handleGeoresourceOnMap($event)"
          (zoomToLayer)="zoomToLayer($event)"
        >
        </app-georesource-list-tab>
      </div>

      <div
        class="tab-pane"
        id="poiTab3Content"
        role="tabpanel"
        aria-labelledby="poiTab3"
        *ngIf="showFavSelection"
      >
        <app-georesource-fav-tab
          [showFavSelection]="showFavSelection"
          (toggleGeoresourceOnMap)="handleGeoresourceOnMap($event)"
          (showAllOnTopic)="handleShowAllOnTopic($event, 'favs')"
          (zoomToLayer)="zoomToLayer($event)"
        >
        </app-georesource-fav-tab>
      </div>
    </div>
    <div
      class="favoritesToast"
      id="favoritesToast"
      (click)="favoritesService.onSaveFavSelection([true])"
      [ngClass]="{
        disabled: favoritesService.toastStatus == 0,
        notSaved: favoritesService.toastStatus == 1,
        saved: favoritesService.toastStatus == 2,
      }"
      *ngIf="showFavSelection"
    >
      {{ favoritesService.toastText[favoritesService.toastStatus] }}
    </div>
  </expandable-box>
</div>
