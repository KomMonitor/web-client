<table class="table table-condensed" style="margin-bottom: 0px">
  <thead>
    <tr>
      <th>Typ</th>
      <th>Datensatz</th>
      <th>Beschreibung</th>
      <th>Legende</th>
      <th *ngIf="showPerDatasetDateColumn">Lebenszeit-Beginn</th>
      <th *ngIf="dataExchangeService.showGeoresourceExportButtons">Export</th>
      <th></th>
    </tr>
  </thead>

  <tbody>
    <!-- POIs -->
    <tr *ngFor="let poi of datasets.poiData">
      <td>
        <i class="fas fa-map-marker-alt"></i>
      </td>
      <td>
        <label class="checkbox-inline"
          ><input
            type="checkbox"
            value="poi.datasetName"
            [(ngModel)]="poi.isSelected"
            (change)="toggleGeoresourceOnMap.emit(poi)"
          />
          <b>{{ poi.datasetName }}</b>
          <p
            *ngIf="poi.isSelected"
            title="Auf Layer zoomen"
            (click)="zoomToLayer.emit(poi)"
          >
            <i style="font-size: 1.5em" class="fas fa-search-location"></i>
          </p>
        </label>
        <app-export-item-checkbox
          *ngIf="exportMode.exportMode()"
          kind="georessource"
          [dataset]="exportMode.toExportGeoresource(poi)"
        ></app-export-item-checkbox>
      </td>
      <td>
        <p>{{ poi.metadata.description }}</p>
      </td>
      <td class="text-center">
        <div style="text-align: center">
          <div
            class="awesome-marker-legend awesome-marker-legend-icon-{{
              poi.poiMarkerColor
            }}"
          >
            <span
              *ngIf="
                !poi.poiMarkerStyle || poi.poiMarkerStyle == 'symbol';
                else poiMarkerText
              "
              style="
                margin-left: 3px;
                margin-right: 3px;
                margin-top: 2px;
                font-size: 1.2em;
              "
              [ngStyle]="{ color: poi.poiSymbolColor }"
              class="{{ poi.poiSymbolBootstrap3Name | iconTranslate }}"
              aria-hidden="true"
            ></span>
            <ng-template #poiMarkerText>
              <span
                style="font-size: 0.9em"
                [ngStyle]="{ color: poi.poiSymbolColor }"
                >{{ poi.poiMarkerText }}</span
              >
            </ng-template>
          </div>
        </div>
      </td>
      <td *ngIf="showPerDatasetDateColumn">
        <select
          style="font-size: 11px; width: 135px; padding: 0px"
          [(ngModel)]="poi.selectedDate"
          (change)="selectedDateChange.emit(poi)"
          class="form-control"
          required
        >
          <option
            *ngFor="let date of poi.availablePeriodsOfValidity"
            [ngValue]="date"
          >
            {{ date.startDate }}
          </option>
        </select>
      </td>
      <td
        *ngIf="dataExchangeService.showGeoresourceExportButtons"
        class="text-center export-column"
      >
        <p
          class="poiList-downloadLink"
          (click)="exportGeoresource.emit(poi)"
          title="Download Features as GeoJSON"
        >
          <i class="fas fa-file-download fa-lg"></i>
        </p>
        <p
          class="poiList-downloadLink"
          (click)="dataExchangeService.downloadMetadataPDF_georesource(poi)"
          title="Download Metadata PDF"
        >
          <i class="fas fa-file-export fa-lg"></i>
        </p>
      </td>
      <td>
        <i
          *ngIf="showFavSelection"
          class="fav-star fa-star"
          [ngClass]="{
            'fa-solid': isPoiFav(poi.georesourceId),
            'fa-regular': !isPoiFav(poi.georesourceId),
          }"
          (click)="poiFavClick.emit(poi.georesourceId)"
          style="color: black"
        ></i>
      </td>
    </tr>

    <!-- LOIs -->
    <tr *ngFor="let loi of datasets.loiData">
      <td>
        <i class="fas fa-minus"></i>
      </td>
      <td>
        <label class="checkbox-inline"
          ><input
            type="checkbox"
            value="loi.datasetName"
            [(ngModel)]="loi.isSelected"
            (change)="toggleGeoresourceOnMap.emit(loi)"
          />
          <b>{{ loi.datasetName }}</b>
          <p
            *ngIf="loi.isSelected"
            title="Auf Layer zoomen"
            (click)="zoomToLayer.emit(loi)"
          >
            <i style="font-size: 1.5em" class="fas fa-search-location"></i>
          </p>
        </label>
        <app-export-item-checkbox
          *ngIf="exportMode.exportMode()"
          kind="georessource"
          [dataset]="exportMode.toExportGeoresource(loi)"
        ></app-export-item-checkbox>
      </td>
      <td>
        <p>{{ loi.metadata.description }}</p>
      </td>
      <td class="text-center">
        <div style="text-align: center">
          <i
            class="poiColorLegend"
            [ngStyle]="{ background: loi.loiColor, display: 'inherit' }"
          ></i>
        </div>
      </td>
      <td *ngIf="showPerDatasetDateColumn">
        <select
          style="font-size: 11px; width: 135px; padding: 0px"
          [(ngModel)]="loi.selectedDate"
          (change)="selectedDateChange.emit(loi)"
          class="form-control"
          required
        >
          <option
            *ngFor="let date of loi.availablePeriodsOfValidity"
            [ngValue]="date"
          >
            {{ date.startDate }}
          </option>
        </select>
      </td>
      <td
        *ngIf="dataExchangeService.showGeoresourceExportButtons"
        class="text-center export-column"
      >
        <p
          class="poiList-downloadLink"
          (click)="exportGeoresource.emit(loi)"
          title="Download Features as GeoJSON"
        >
          <i class="fas fa-file-download fa-lg"></i>
        </p>
        <p
          class="poiList-downloadLink"
          (click)="dataExchangeService.downloadMetadataPDF_georesource(loi)"
          title="Download Metadata PDF"
        >
          <i class="fas fa-file-export fa-lg"></i>
        </p>
      </td>
      <td>
        <i
          *ngIf="showFavSelection"
          class="fav-star fa-star"
          [ngClass]="{
            'fa-solid': isPoiFav(loi.georesourceId),
            'fa-regular': !isPoiFav(loi.georesourceId),
          }"
          (click)="poiFavClick.emit(loi.georesourceId)"
          style="color: black"
        ></i>
      </td>
    </tr>

    <!-- AOIs -->
    <tr *ngFor="let aoi of datasets.aoiData">
      <td>
        <i class="far fa-square"></i>
      </td>
      <td>
        <label class="checkbox-inline"
          ><input
            type="checkbox"
            value="aoi.datasetName"
            [(ngModel)]="aoi.isSelected"
            (change)="toggleGeoresourceOnMap.emit(aoi)"
          />
          <b>{{ aoi.datasetName }}</b>
          <p
            *ngIf="aoi.isSelected"
            title="Auf Layer zoomen"
            (click)="zoomToLayer.emit(aoi)"
          >
            <i style="font-size: 1.5em" class="fas fa-search-location"></i>
          </p>
        </label>
        <app-export-item-checkbox
          *ngIf="exportMode.exportMode()"
          kind="georessource"
          [dataset]="exportMode.toExportGeoresource(aoi)"
        ></app-export-item-checkbox>
      </td>
      <td>
        <p>{{ aoi.metadata.description }}</p>
      </td>
      <td class="text-center">
        <div style="text-align: center">
          <i
            class="poiColorLegend"
            [ngStyle]="{ background: aoi.aoiColor, display: 'inherit' }"
          ></i>
        </div>
      </td>
      <td *ngIf="showPerDatasetDateColumn">
        <select
          style="font-size: 11px; width: 135px; padding: 0px"
          [(ngModel)]="aoi.selectedDate"
          (change)="selectedDateChange.emit(aoi)"
          class="form-control"
          required
        >
          <option
            *ngFor="let date of aoi.availablePeriodsOfValidity"
            [ngValue]="date"
          >
            {{ date.startDate }}
          </option>
        </select>
      </td>
      <td
        *ngIf="dataExchangeService.showGeoresourceExportButtons"
        class="text-center export-column"
      >
        <p
          class="poiList-downloadLink"
          (click)="exportGeoresource.emit(aoi)"
          title="Download Features as GeoJSON"
        >
          <i class="fas fa-file-download fa-lg"></i>
        </p>
        <p
          class="poiList-downloadLink"
          (click)="dataExchangeService.downloadMetadataPDF_georesource(aoi)"
          title="Download Metadata PDF"
        >
          <i class="fas fa-file-export fa-lg"></i>
        </p>
      </td>
      <td>
        <i
          *ngIf="showFavSelection"
          class="fav-star fa-star"
          [ngClass]="{
            'fa-solid': isPoiFav(aoi.georesourceId),
            'fa-regular': !isPoiFav(aoi.georesourceId),
          }"
          (click)="poiFavClick.emit(aoi.georesourceId)"
          style="color: black"
        ></i>
      </td>
    </tr>

    <!-- WMS -->
    <tr *ngFor="let dataset of datasets.wmsData">
      <td>
        <b><i>WMS</i></b>
      </td>
      <td>
        <label class="checkbox-inline"
          ><input
            type="checkbox"
            value="dataset.title"
            [(ngModel)]="dataset.isSelected"
            (change)="toggleWmsOnMap.emit(dataset)"
          />
          <b>{{ dataset.title }}</b>
        </label>
      </td>
      <td>
        <p>{{ dataset.description }}</p>
      </td>
      <td class="text-center">
        <div *ngIf="!dataset.showLegend">
          <button
            class="btn btn-sm btn-primary"
            (click)="dataset.showLegend = true"
          >
            laden
          </button>
        </div>
        <div *ngIf="dataset.showLegend">
          <img
            [src]="ogcService.buildLegendUrl(dataset.url, dataset.layerName)"
          />
        </div>
      </td>
      <td>-</td>
      <td
        *ngIf="dataExchangeService.showGeoresourceExportButtons"
        class="text-center"
      >
        <div style="text-align: center">
          <a
            href="{{
              dataset.url
            }}service=WMS&request=GetCapabilities&version=1.3.0"
            title="WMS GetCapabilities URL"
            rel="noopener noreferrer"
            target="_blank"
            ><i class="fas fa-cloud-download-alt"></i
          ></a>
        </div>
      </td>
      <td>
        <i
          *ngIf="showFavSelection"
          class="fav-star fa-star"
          [ngClass]="{
            'fa-solid': isWmsFav(dataset.id),
            'fa-regular': !isWmsFav(dataset.id),
          }"
          (click)="wmsFavClick.emit(dataset.id)"
          style="color: black"
        ></i>
      </td>
    </tr>

    <!-- WFS -->
    <tr *ngFor="let dataset of datasets.wfsData">
      <td>
        <b><i>WFS</i></b>
      </td>
      <td>
        <label class="checkbox-inline"
          ><input
            type="checkbox"
            value="dataset.title"
            [(ngModel)]="dataset.isSelected"
            (change)="toggleWfsOnMap.emit(dataset)"
          />
          <b>{{ dataset.title }}</b>
        </label>
      </td>
      <td>
        <p>{{ dataset.description }}</p>
      </td>
      <td class="text-center">
        <div>
          <div *ngIf="dataset.geometryType === 'AOI'">
            <div class="input-group colorpicker-component">
              <input
                type="text"
                style="display: none"
                class="form-control input-sm"
                [(ngModel)]="dataset.aoiColor"
                (change)="wfsColorChange.emit(dataset)"
                placeholder="WFS Darstellungsfarbe"
                required
              />
              <span
                title="Klicken, um die Farbe anzupassen"
                style="border: 1px solid #ccc"
                class="input-group-addon"
                ><i></i
              ></span>
            </div>
          </div>
          <div *ngIf="dataset.geometryType === 'LOI'">
            <div class="input-group colorpicker-component">
              <input
                type="text"
                style="display: none"
                class="form-control input-sm"
                [(ngModel)]="dataset.loiColor"
                (change)="wfsColorChange.emit(dataset)"
                placeholder="WFS Darstellungsfarbe"
                required
              />
              <span
                title="Klicken, um die Farbe anzupassen"
                style="border: 1px solid #ccc"
                class="input-group-addon"
                ><i></i
              ></span>
            </div>
          </div>
          <div *ngIf="dataset.geometryType === 'POI'">
            <div style="text-align: center">
              <div
                class="awesome-marker-legend awesome-marker-legend-icon-{{
                  dataset.poiMarkerColor
                }}"
              >
                <span
                  style="
                    margin-left: 3px;
                    margin-right: 3px;
                    margin-top: 2px;
                    font-size: 1.2em;
                  "
                  [ngStyle]="{ color: dataset.poiSymbolColor }"
                  class="glyphicon glyphicon-{{
                    dataset.poiSymbolBootstrap3Name
                  }}"
                  aria-hidden="true"
                ></span>
              </div>
            </div>
          </div>
        </div>
      </td>
      <td>-</td>
      <td
        *ngIf="dataExchangeService.showGeoresourceExportButtons"
        class="text-center"
      >
        <div style="text-align: center">
          <a
            [href]="ogcService.buildGetCapabilitiesUrl(dataset.url)"
            title="WFS GetCapabilities URL"
            rel="noopener noreferrer"
            target="_blank"
            ><i class="fas fa-cloud-download-alt"></i
          ></a>
        </div>
      </td>
    </tr>
  </tbody>
</table>
