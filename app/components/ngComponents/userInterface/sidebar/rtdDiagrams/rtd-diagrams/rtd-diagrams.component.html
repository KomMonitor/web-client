<div style="text-align: center">
	<div style="text-align: center">
		<div class="loading-overlay-sidebar-small ng-hide" *ngIf="loadingData">
					<span class="glyphicon glyphicon-refresh icon-spin"></span>
		</div>
	</div>

  <expandable-box [title]="'Echtzeitdaten'" [collapsed]="false">
    <div style="text-align: left">
      Infos und mehr 
    </div>
  </expandable-box>
  <expandable-box [title]="lineTitle" [collapsed]="false" [borderColor]="'green'">

    <div class="chart" *ngIf="this.loadingData"> 
      <b>No data selected</b>
    </div>  
    
    <div style="text-align: center" [ngClass]="{'hidden': this.loadingData}">
      <label>
        <b>Darstellungsform</b>
        <select [(ngModel)]="displayFormat" (change)="onChangeDisplayFormat()" class="form-control">
          <option [value]="displayFormatOptions.AVG" selected>Durchschnitt</option>
          <option [value]="displayFormatOptions.MIN">Minimum</option>
          <option [value]="displayFormatOptions.MAX">Maximum</option>
          <option [value]="displayFormatOptions.SUM">Summe</option>
        </select>
      </label>
      <label>
        <b>Aufl&ouml;sung</b>
        <div class="breakupWrapper">
          <select [(ngModel)]="displayBreakupValue" (change)="onChangeDisplayFormat()" [disabled]="displayFormat==displayFormatOptions.STD" class="form-control">
            <option *ngFor="let i of displayBreakupValueOptions">{{i}}</option>
          </select>
          <select [(ngModel)]="displayBreakup" (change)="onChangeDisplayFormat()" [disabled]="displayFormat==displayFormatOptions.STD" class="form-control">
            <option [value]="displayBreakupOptions.MINUTES">Minuten</option>
            <option [value]="displayBreakupOptions.HOUR">Stunden</option>
            <option [value]="displayBreakupOptions.DAY" selected>Tage</option>
            <option [value]="displayBreakupOptions.MONTH">Monate</option>
            <option [value]="displayBreakupOptions.YEAR">Jahre</option>
          </select>
        </div>
      </label>
    </div>

    <custom-slider *ngIf="!loadingData" [data]="sliderData" [type]="SliderType.RANGE" [markerPositions]="sliderMarker" [displayMode]="DisplayMode.DATE" (valueChange)="onSliderChange($event)"></custom-slider>
    
    <!-- use class iso *ngif to load but hide element, otherwise echarts can not build diagram -->
    <div class="chart" [ngClass]="{'hidden': this.loadingData}"> 
      <div id="rtdLineDiagram" style="width:100%; min-height:40vh;"></div>
    </div>  
  </expandable-box>
</div>
