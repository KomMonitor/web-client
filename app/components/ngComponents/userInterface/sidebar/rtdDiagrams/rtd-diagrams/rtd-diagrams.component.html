<div style="text-align: center">
	<div style="text-align: center">
		<div class="loading-overlay-sidebar-small ng-hide" *ngIf="loadingData">
					<span class="glyphicon glyphicon-refresh icon-spin"></span>
		</div>
	</div>

  <expandable-box *ngIf="data" [title]="'Echtzeitdaten'" [collapsed]="false">
    <div style="text-align: left">
      Infos und mehr 
    </div>
  </expandable-box>
  <expandable-box *ngIf="data" [title]="lineTitle" [collapsed]="false" [borderColor]="'green'">
    <div class="chart">
      <div id="rtdLineDiagram" style="width:100%; min-height:40vh;"></div>
    </div>  
  </expandable-box>
	
</div>
