<ng-template #IndicatorItem let-indicator="indicator">
  <div
    [id]="'indicatorHierarchyElement-' + indicator.indicatorId"
    class="list-group-item list-group-item-default"
    [ngClass]="{
      'style-headline-indicator': indicator.isHeadlineIndicator,
      'style-simple-indicator': !indicator.isHeadlineIndicator,
      active: selectionState.selectedIndicator.indicatorId == indicator.indicatorId,
    }"
  >
    <div class="list-group-item-entry-grid-layout">
      <div>
        <p
          style="cursor: pointer"
          [style.color]="indicator.isHeadlineIndicator ? 'white' : null"
          title="{{ indicator.indicatorName }} [{{ indicator.unit }}]"
          (click)="indicatorClicked.emit(indicator)"
        >
          <i
            [ngClass]="indicator.isHeadlineIndicator ? 'fas fa-tachometer-alt' : 'fas fa-sitemap'"
          ></i>
          &nbsp;&nbsp;<b>{{ indicator.indicatorName }}</b> [{{ indicator.unit }}]
        </p>
        <app-indicator-metadata-tooltip
          [indicatorData]="{ data: indicator }"
        ></app-indicator-metadata-tooltip>
      </div>
      <div>
        @if (showFavSelection) {
          <i
            class="fav-star fa-star"
            [ngClass]="{
              'fa-solid': indicatorFavItems.includes(indicator.indicatorId),
              'fa-regular': !indicatorFavItems.includes(indicator.indicatorId),
            }"
            (click)="indicatorFavToggled.emit(indicator.indicatorId)"
            style="color: black"
          ></i>
        }
      </div>
    </div>
    @if (exportModeService.exportMode()) {
      <app-export-item-checkbox
        kind="indicator"
        [dataset]="toExportIndicator(indicator)"
      ></app-export-item-checkbox>
    }
  </div>
</ng-template>

<ng-template #TopicTree let-topics="topics" let-level="level">
  @for (topic of topics; track topic) {
    <app-topic-element
      [topic]="topic"
      [level]="level"
      [collapsed]="collapsedTopicIds.includes(topic.topicId)"
      [showFavSelection]="showFavSelection"
      [isFavorite]="indicatorTopicFavItems.includes(topic.topicId)"
      [containsSelectedIndicator]="checkHierarchyIndicatorSelected(topic)"
      (toggleCollapse)="onTopicClick(topic.topicId)"
      (favToggled)="indicatorTopicFavToggled.emit(topic.topicId)"
    >
      <ng-container
        *ngTemplateOutlet="TopicTree; context: { topics: topic.subTopics, level: level + 1 }"
      ></ng-container>
      <div class="list-group indicatorInputForm">
        @for (indicator of topic.indicatorData; track indicator) {
          <ng-container
            *ngTemplateOutlet="IndicatorItem; context: { indicator: indicator }"
          ></ng-container>
        }
        @if (topic.wmsData.length) {
          <div class="list-group-item list-group-item-default">
            <app-wms-table
              [wmsDataList]="topic.wmsData"
              [showFavSelection]="showFavSelection"
              [wmsFavItems]="wmsFavItems"
              (wmsToggled)="wmsToggled.emit($event)"
              (wmsFavToggled)="wmsFavToggled.emit($event)"
            ></app-wms-table>
          </div>
        }
      </div>
    </app-topic-element>
  }
</ng-template>

<ng-container *ngTemplateOutlet="TopicTree; context: { topics: topics, level: 0 }"></ng-container>
