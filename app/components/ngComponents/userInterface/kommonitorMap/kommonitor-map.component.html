<div style="position: relative">
  <div style="text-align: center">
    @if (loadingData) {
      <div class="loading-overlay">
        <span class="fas fa-arrows-rotate icon-spin"></span>
      </div>
    }
  </div>

  <div style="max-width: 50%; z-index: 1; position: absolute">
    <!-- TODO: MathJax rendering of the process description is not ported. master fills this
         paragraph via its `mathjaxBind` AngularJS directive (app.js) and loads MathJax in
         index.html; neither exists here, so the node stays empty and pdf-export.service.ts
         screenshots an empty paragraph for formula indicators. See OFFENE_PUNKTE.md, A4. -->
    <p id="indicatorProcessDescription"></p>
  </div>

  <div
    id="ngMap"
    style="z-index: 2"
    [ngClass]="{ manualMapSelection: reachabilityStateService.manualMapSelectionMode }"
    (mousemove)="onMouseMove($event)"
    (mouseenter)="showMouseTooltip = true"
    (mouseleave)="showMouseTooltip = false"
  >
    @if (reachabilityStateService.manualMapSelectionMode && showMouseTooltip) {
      <div id="mouseTooltip" [style.left.px]="mouseX + 12" [style.top.px]="mouseY + 12">
        Standort setzen
      </div>
    }
  </div>
</div>
