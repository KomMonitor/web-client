<div class="container-fluid">
  @if (reportingService.hasPausedSetup) {
    <div class="row row-no-gutters">
      <div class="col-sm-12">
        <div class="alert alert-info resume-setup-info" role="alert">
          <span>Es liegt ein begonnenes Report-Setup vor.</span>
          <button
            type="button"
            id="reporting-continueSetupBtn"
            class="btn btn-sm btn-outline-primary"
            (click)="reportingService.resumePausedSetup()"
          >
            Setup fortsetzen
          </button>
        </div>
      </div>
    </div>
  }
  <div class="row row-no-gutters">
    <div class="col-sm-12 text-center">
      <!-- <h2 class="fs-title"></h2> -->
      <p>Möchten Sie einen neuen Report erstellen oder einen bestehenden Report anpassen?</p>
    </div>
  </div>
  <div class="select-wrapper">
    <button
      id="reporting-createNewReportBtn"
      class="btn btn-primary"
      (click)="reportingService.changeWorkflowState(workflowState.templateSelect)"
    >
      <i class="fa fa-plus"></i>
      Neuen Report erstellen
    </button>
    <button
      for="reporting-load-settings-button"
      class="btn btn-primary"
      (click)="fileInput.click()"
    >
      <input
        type="file"
        id="reporting-load-settings-button"
        #fileInput
        (change)="onConfigSelect($event)"
      />
      <i class="fa fa-file-download"></i>
      &nbsp;&nbsp;Konfigurationsdatei importieren
    </button>
  </div>
</div>
