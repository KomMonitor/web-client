<div class="language-switcher">
  <!-- Debug info (remove in production) -->
  <div style="font-size: 10px; color: #666; margin-bottom: 5px;">
    Debug: Current Lang: {{ currentLanguage }} | Service Lang: {{ translateService.currentLang }}
  </div>
  
  <div class="dropdown">
    <button class="btn btn-link dropdown-toggle" type="button" id="languageDropdown" 
            data-toggle="dropdown" aria-haspopup="true" aria-expanded="false">
      <span class="language-name">{{ getCurrentLanguageName() }}</span>
    </button>
    <div class="dropdown-menu" aria-labelledby="languageDropdown">
      <a class="dropdown-item" href="#" 
         *ngFor="let lang of supportedLanguages" 
         (click)="changeLanguage(lang.code); $event.preventDefault()"
         [class.active]="lang.code === currentLanguage">
        <span class="language-name">{{ lang.name }}</span>
      </a>
    </div>
  </div>
</div>
