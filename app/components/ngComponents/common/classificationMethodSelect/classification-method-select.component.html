<div id="classificationMethodSelect">
  <div
    id="method-select-selected"
    class="form-control"
    (click)="showMethodSelection = !showMethodSelection"
  >
    {{ selectedMethod!.name }}
  </div>
  <div [hidden]="!showMethodSelection" id="method-select-selection" class="select-border">
    @for (method of preppedMethods; track method) {
      <div id="method-select-method" (click)="methodSelected(method)">
        <div
          class="method-select-method-symbol"
          style="background-image: url('{{ preloadImgs[method.name] }}')"
        ></div>
        <div class="method-select-method-text">
          <div class="method-select-method-name">{{ method.name }}</div>
          <div class="method-select-method-description">{{ method.description }}</div>
        </div>
      </div>
    }
  </div>
</div>
