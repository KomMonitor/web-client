<div class="epsg-picker">
  @if (label) {
    <label class="form-label fw-semibold" [for]="selectId">{{ label }}</label>
  }

  <select
    [id]="selectId"
    class="form-select mb-2"
    [disabled]="disabled"
    [(ngModel)]="selectedDropdownValue"
    (ngModelChange)="onDropdownChange()"
    (blur)="markTouched()"
    [attr.aria-label]="label || 'EPSG-Code'"
  >
    @if (selectedDropdownValue === null) {
      <option [ngValue]="null" disabled>Bitte wählen …</option>
    }
    @for (opt of options; track opt.code) {
      <option [ngValue]="opt.code">
        {{ opt.label }}
      </option>
    }
    <option [ngValue]="customSentinel">Eigenen EPSG-Code eingeben …</option>
  </select>

  @if (isCustomMode) {
    <div class="custom-input-wrapper">
      <div class="input-group" [class.has-validation]="customInputValid !== null">
        <span class="input-group-text">EPSG:</span>
        <input
          type="number"
          class="form-control"
          [class.is-valid]="customInputValid === true"
          [class.is-invalid]="customInputValid === false"
          placeholder="z. B. 25832"
          min="1"
          max="99999"
          step="1"
          [disabled]="disabled"
          [(ngModel)]="customInputRaw"
          (ngModelChange)="onCustomInputChange()"
          (blur)="markTouched()"
          aria-label="EPSG-Code"
        />
        @if (customInputValid === true) {
          <div class="valid-feedback">Gültiger EPSG-Code.</div>
        }
        @if (customInputValid === false) {
          <div class="invalid-feedback">
            Bitte geben Sie eine ganze Zahl zwischen 1 und 99999 ein.
          </div>
        }
      </div>
      <small class="text-muted mt-1 d-block">
        Bekannte Codes finden Sie auf
        <a href="https://epsg.io" target="_blank" rel="noopener noreferrer">epsg.io</a>.
      </small>
    </div>
  }
</div>
