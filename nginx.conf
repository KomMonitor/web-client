
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    server {
        listen 80;
        server_name  localhost;

        root   /usr/share/nginx/html;
        index  index.html index.htm;
        include /etc/nginx/mime.types;

        gzip on;
        gzip_min_length 1000;
        gzip_proxied expired no-cache no-store private auth;
        gzip_types text/plain text/css application/json application/javascript application/x-javascript text/xml application/xml application/xml+rss text/javascript;

        # Bundles with a content hash in their name (`ng build` outputHashing):
        # a new build means new names, so these may be cached forever.
        location ~ "^/([^/]+-[A-Z0-9]{8}\.(js|css)|media/.+)$" {
            add_header Cache-Control "public, max-age=31536000, immutable";
            # A chunk an outdated tab still asks for gets a real 404, not
            # index.html served as JavaScript.
            try_files $uri =404;
        }

        # Everything else keeps its name across builds: index.html (which
        # references the hashed bundles), the SPA fallback, assets/i18n, config/,
        # icons/, logos/, mathjax/. Without an explicit header, browsers cache
        # these heuristically and serve the previous build on first load.
        # `no-cache` makes them revalidate on every use (a cheap 304 via ETag).
        location / {
            add_header Cache-Control "no-cache";
            try_files $uri $uri/ /index.html;
        }
    }
}
